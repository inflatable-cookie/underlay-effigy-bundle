[containers.disposable_test.dns]
routes = [
  { domain = "{{ test_s3_domain }}", tls = true, port = 9000, service = "silo" },
  { domain = "dbgate.{{ test_host }}", tls = true, port = 3000, service = "dbgate" },
  { domain = "mailpit.{{ test_host }}", tls = true, port = 8025, service = "mailpit" },
  { domain = "{{ test_silo_domain }}", tls = true, port = 9001, service = "silo" },
]

[[containers.disposable_test.host_processes]]
name = "api"
run = 'python3 "{{ bundle.root }}/scripts/dev/managed-rust-listener.py" -- "{{ sel_api }}/api"'
cwd = "."
restart = "on-failure"
env = { UNDERLAY_PROFILE_EFFIGY_SOURCE = "{{ inputs.profiles.effigy_source }}", UNDERLAY_PROFILE_EFFIGY_BIN = "{{ inputs.profiles.effigy_binary }}", EFFIGY_PROFILE_CONTAINER_NAME = "disposable_test", EFFIGY_PROFILE_HOST_CONTAINER_NAME = "disposable_test", EFFIGY_PROFILE_DATABASE_NAME = "{{ inputs.databases|first }}", EFFIGY_PROFILE_DATABASE_PASSWORD = "secret", EFFIGY_PROFILE_API_DECLARED = "{{ test_api_domain }}", EFFIGY_PROFILE_FRONT_DECLARED = "{{ test_front_domain }}", EFFIGY_PROFILE_ADMIN_DECLARED = "{{ test_admin_domain }}", EFFIGY_PROFILE_S3_DECLARED = "{{ test_s3_domain }}", EFFIGY_PROFILE_DBGATE_DECLARED = "dbgate.{{ test_host }}", EFFIGY_PROFILE_MAILPIT_DECLARED = "mailpit.{{ test_host }}", EFFIGY_PROFILE_SILO_DECLARED = "{{ test_silo_domain }}", EFFIGY_PROFILE_SILO_BUCKET = "{{ inputs.profiles.silo_bucket or (inputs.databases|first ~ '-media') }}", AWS_ACCESS_KEY_ID = "minioadmin", AWS_SECRET_ACCESS_KEY = "minioadmin", AWS_EC2_METADATA_DISABLED = "true" }

[containers.disposable_test.host_processes.listener]
bind = "127.0.0.1:0"

[containers.disposable_test.host_processes.listener.readiness]
path = "/v1/health"
status = 200
timeout_secs = 540

[containers.disposable_test.host_processes.listener.route]
domain = "{{ test_api_domain }}"
tls = true

{% for app in [("front", sel_front, inputs.dirs.front or "app-front", test_front_domain), ("admin", sel_admin, inputs.dirs.admin or "app-admin", test_admin_domain)] %}
[[containers.disposable_test.host_processes]]
name = "{{ app[0] }}"
run = 'bun "{{ bundle.root }}/scripts/dev/managed-vite-listener.mjs"'
cwd = "{{ app[2] }}"
restart = "on-failure"
depends_on = ["api"]
env = { UNDERLAY_PROFILE_EFFIGY_SOURCE = "{{ inputs.profiles.effigy_source }}", UNDERLAY_PROFILE_EFFIGY_BIN = "{{ inputs.profiles.effigy_binary }}", EFFIGY_PROFILE_CONTAINER_NAME = "disposable_test", EFFIGY_PROFILE_HOST_CONTAINER_NAME = "disposable_test", EFFIGY_PROFILE_API_DECLARED = "{{ test_api_domain }}", EFFIGY_PROFILE_FRONT_DECLARED = "{{ test_front_domain }}", EFFIGY_PROFILE_ADMIN_DECLARED = "{{ test_admin_domain }}", EFFIGY_PROFILE_DBGATE_DECLARED = "dbgate.{{ test_host }}", EFFIGY_PROFILE_MAILPIT_DECLARED = "mailpit.{{ test_host }}", EFFIGY_PROFILE_SILO_DECLARED = "{{ test_silo_domain }}", EFFIGY_PROFILE_SELF_DECLARED = "{{ app[3] }}", EFFIGY_PROFILE_PUBLIC_CONFIG_FILE = "src/lib/config/public-api.generated.ts", EFFIGY_PROFILE_PUBLIC_CONFIG_GENERATOR = "scripts/generate-public-config.ts", EFFIGY_PROFILE_VITE_CONFIG = "vite.config.ts", ENVIRONMENT = "effigy" }

[containers.disposable_test.host_processes.listener]
bind = "127.0.0.1:0"

[containers.disposable_test.host_processes.listener.readiness]
path = "/"
status = 200
timeout_secs = 540

[containers.disposable_test.host_processes.listener.route]
domain = "{{ app[3] }}"
tls = true
{% endfor %}

[tasks."dev:hybrid"]
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_launcher.py" start hybrid --repo {repo}'
run_in = "host"
secrets = "required"
env = { EFFIGY_PROFILE_SILO_BUCKET = "{{ inputs.profiles.silo_bucket or (inputs.databases|first ~ '-media') }}", EFFIGY_PROFILE_API_DECLARED = "{{ api_domain }}", EFFIGY_PROFILE_FRONT_DECLARED = "{{ front_domain }}", EFFIGY_PROFILE_ADMIN_DECLARED = "{{ admin_domain }}", EFFIGY_PROFILE_S3_DECLARED = "{{ s3_domain }}", EFFIGY_PROFILE_SILO_DECLARED = "{{ silo_domain }}", EFFIGY_PROFILE_DBGATE_DECLARED = "dbgate.{{ inputs.host }}", EFFIGY_PROFILE_MAILPIT_DECLARED = "mailpit.{{ inputs.host }}", UNDERLAY_PROFILE_EFFIGY_SOURCE = "{{ inputs.profiles.effigy_source }}", UNDERLAY_PROFILE_EFFIGY_BIN = "{{ inputs.profiles.effigy_binary }}", UNDERLAY_PROFILE_TEST_TASK = "{{ inputs.profiles.test_task }}", UNDERLAY_PROFILE_TEST_TIMEOUT_SECS = "{{ inputs.profiles.test_timeout_secs }}" }

[tasks."dev:hybrid:status"]
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_launcher.py" status hybrid --repo {repo}'
run_in = "host"
env = { UNDERLAY_PROFILE_EFFIGY_SOURCE = "{{ inputs.profiles.effigy_source }}", UNDERLAY_PROFILE_EFFIGY_BIN = "{{ inputs.profiles.effigy_binary }}" }

[tasks."dev:hybrid:down"]
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_launcher.py" down hybrid --repo {repo}'
run_in = "host"
env = { UNDERLAY_PROFILE_EFFIGY_SOURCE = "{{ inputs.profiles.effigy_source }}", UNDERLAY_PROFILE_EFFIGY_BIN = "{{ inputs.profiles.effigy_binary }}" }

[tasks."dev:test"]
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_launcher.py" test disposable_test --repo {repo}'
run_in = "host"
secrets = "required"
env = { EFFIGY_PROFILE_SILO_BUCKET = "{{ inputs.profiles.silo_bucket or (inputs.databases|first ~ '-media') }}", EFFIGY_PROFILE_API_DECLARED = "{{ test_api_domain }}", EFFIGY_PROFILE_FRONT_DECLARED = "{{ test_front_domain }}", EFFIGY_PROFILE_ADMIN_DECLARED = "{{ test_admin_domain }}", EFFIGY_PROFILE_S3_DECLARED = "{{ test_s3_domain }}", EFFIGY_PROFILE_SILO_DECLARED = "{{ test_silo_domain }}", EFFIGY_PROFILE_DBGATE_DECLARED = "dbgate.{{ test_host }}", EFFIGY_PROFILE_MAILPIT_DECLARED = "mailpit.{{ test_host }}", UNDERLAY_PROFILE_EFFIGY_SOURCE = "{{ inputs.profiles.effigy_source }}", UNDERLAY_PROFILE_EFFIGY_BIN = "{{ inputs.profiles.effigy_binary }}", UNDERLAY_PROFILE_TEST_TASK = "{{ inputs.profiles.test_task }}", UNDERLAY_PROFILE_TEST_TIMEOUT_SECS = "{{ inputs.profiles.test_timeout_secs }}" }

[tasks."dev:test:status"]
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_launcher.py" status disposable_test --repo {repo}'
run_in = "host"
env = { UNDERLAY_PROFILE_EFFIGY_SOURCE = "{{ inputs.profiles.effigy_source }}", UNDERLAY_PROFILE_EFFIGY_BIN = "{{ inputs.profiles.effigy_binary }}" }

[tasks."dev:test:down"]
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_launcher.py" down disposable_test --repo {repo}'
run_in = "host"
env = { UNDERLAY_PROFILE_EFFIGY_SOURCE = "{{ inputs.profiles.effigy_source }}", UNDERLAY_PROFILE_EFFIGY_BIN = "{{ inputs.profiles.effigy_binary }}" }
{% endif %}

[bootstrap]
run = [
  { task = "secrets init" },
  { task = "silo:prepare" },
  { task = "silo:admit" },
  { task = "container up --detach" },
  { task = "silo:reconcile" },
{% if inputs.workspace.js_root %}  { task = "workspace:js:prepare" },
{% elif inputs.sources.siblings %}  { task = "bootstrap deps sync {% if inputs.sources.underlay %}{{ inputs.sources.underlay }}{% else %}../underlay{% endif %}{% if inputs.dirs.api %} {{ inputs.dirs.api }}{% else %} app-api{% endif %}{% if inputs.dirs.client %} {{ inputs.dirs.client }}{% else %} app-client{% endif %}{% if inputs.dirs.ui %} {{ inputs.dirs.ui }}{% else %} app-ui{% endif %}{% if inputs.dirs.front %} {{ inputs.dirs.front }}{% else %} app-front{% endif %}{% if inputs.dirs.admin %} {{ inputs.dirs.admin }}{% else %} app-admin{% endif %}" },
{% endif %}
]
start = "dev"

{% if inputs.sources.siblings %}[[bootstrap.children]]
path = "{% if inputs.sources.underlay %}{{ inputs.sources.underlay }}{% else %}../underlay{% endif %}"
repo = "git@github.com:inflatable-cookie/underlay.git"
branch = "main"

[[bootstrap.children]]
path = "{% if inputs.sources.poodle %}{{ inputs.sources.poodle }}{% else %}../poodle{% endif %}"
repo = "git@github.com:inflatable-cookie/poodle.git"
branch = "main"
{% endif %}

[deploy.model.app]
bundle = "{{ bundle.name }}"
project_name = "{{ resolved_project_name }}"
source_root = "."

[[deploy.model.services]]
name = "front"
role = "static"
runtime = "node"
source_root = "{% if inputs.dirs.front %}{{ inputs.dirs.front }}{% else %}app-front{% endif %}"
domains = ["{{ route_domain(inputs.host, inputs.routes.front, '') }}"]

[deploy.model.services.build]
task = "build"

[deploy.model.services.output]
kind = "directory"
path = "build"
detect_static_fallback = true

[[deploy.model.services]]
name = "admin"
role = "static"
runtime = "node"
source_root = "{% if inputs.dirs.admin %}{{ inputs.dirs.admin }}{% else %}app-admin{% endif %}"
domains = ["{{ route_domain(inputs.host, inputs.routes.admin, 'admin') }}"]

[deploy.model.services.build]
task = "build"

[deploy.model.services.output]
kind = "directory"
path = "build"
detect_static_fallback = true

[[deploy.model.services]]
name = "api"
role = "web"
runtime = "rust"
source_root = "{% if inputs.dirs.api %}{{ inputs.dirs.api }}{% else %}app-api{% endif %}"
port = {{ inputs.api_port }}
domains = ["{{ route_domain(inputs.host, inputs.routes.api, 'api') }}"]
secret_refs = ["DATABASE_URL"]

[deploy.model.services.build]
task = "build"

[deploy.model.services.start]
task = "api"

[deploy.model.services.release]
task = "db:migrate"
optional = true
warn_if_missing = true
warning_code = "missing-release-hook"
warning_target = "api"
warning_message = "No explicit `db:migrate` release or migration command is promoted into the deployment model yet"
warning_severity = "warn"

[deploy.model.services.health]
kind = "http"
path = "/v1/health"

[[deploy.model.services]]
name = "jobs"
role = "worker"
runtime = "rust"
source_root = "{% if inputs.dirs.api %}{{ inputs.dirs.api }}{% else %}app-api{% endif %}"
secret_refs = ["DATABASE_URL"]

[deploy.model.services.build]
task = "build"

[deploy.model.services.start]
task = "jobs"
omit_service_if_missing = true

[[deploy.model.backing_services]]
name = "postgres"
kind = "postgres"
mode = "managed"
required = true
consumers = ["api", "jobs"]

[[deploy.model.domains]]
host = "{{ route_domain(inputs.host, inputs.routes.front, '') }}"
service = "front"
tls = "provider_managed"

[[deploy.model.domains]]
host = "{{ route_domain(inputs.host, inputs.routes.admin, 'admin') }}"
service = "admin"
tls = "provider_managed"

[[deploy.model.domains]]
host = "{{ route_domain(inputs.host, inputs.routes.api, 'api') }}"
service = "api"
tls = "provider_managed"

[[deploy.model.secrets]]
name = "DATABASE_URL"
services = ["api", "jobs"]
required = true
source = "operator"
notes = "Managed Postgres connection string for primary database `{% if inputs.databases %}{{ inputs.databases|first }}{% else %}app{% endif %}`"

[tasks."smoke:error-logging"]
run = [{ rhai = "{{ bundle.root }}/scripts/error-reporting.rhai" }]
run_in = "host"

[tasks."metrics:error-log"]
run = [{ rhai = "{{ bundle.root }}/scripts/error-reporting.rhai" }]
run_in = "host"

[tasks."validate:error-reporting"]
run = [{ rhai = "{{ bundle.root }}/scripts/error-reporting.rhai" }]
run_in = "host"

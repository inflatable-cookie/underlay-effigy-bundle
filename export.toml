[manifest]
minimum_effigy_version = "0.13.1"
extend = ["bootstrap.children", "secrets"]

{% set resolved_project_name = inputs.project_name or inputs.workspace_subdir ~ "-" ~ bundle.name %}

{# Physical package directories (`inputs.dirs.*`) and Effigy catalog selectors
   are separate concerns. They coincide in a flat layout, but under the
   `apps/*` / `packages/*` workspace contract a package lives at
   `apps/dairy` while its catalog alias stays `dairy`. `catalogs.*` overrides
   the selector; it falls back to the directory so flat consumers are
   unchanged. #}
{% set sel_api = inputs.catalogs.api or inputs.dirs.api or "app-api" %}
{% set sel_client = inputs.catalogs.client or inputs.dirs.client or "app-client" %}
{% set sel_admin = inputs.catalogs.admin or inputs.dirs.admin or "app-admin" %}
{% set sel_front = inputs.catalogs.front or inputs.dirs.front or "app-front" %}
{% set sel_ui = inputs.catalogs.ui or inputs.dirs.ui %}
{% set sel_docs = inputs.catalogs.docs or inputs.dirs.docs %}

[package_manager]
js = "bun"

# Shared dev environment identifier for every consumer app process: plain
# (non-secret) env from the bundle's schema is folded into all rendered task
# commands, including managed dev-session apps. Secrets stay in the vault.
[env_schema]
schema = "{{ bundle.root }}/env/dev.env.schema"

[catalog.members]
{% if inputs.sources.siblings %}underlay = "{% if inputs.sources.underlay %}{{ inputs.sources.underlay }}{% else %}../underlay{% endif %}"
poodle = "{% if inputs.sources.poodle %}{{ inputs.sources.poodle }}{% else %}../poodle{% endif %}"
{% endif %}api = "{% if inputs.dirs.api %}{{ inputs.dirs.api }}{% else %}app-api{% endif %}"
client = "{% if inputs.dirs.client %}{{ inputs.dirs.client }}{% else %}app-client{% endif %}"
admin = "{% if inputs.dirs.admin %}{{ inputs.dirs.admin }}{% else %}app-admin{% endif %}"
front = "{% if inputs.dirs.front %}{{ inputs.dirs.front }}{% else %}app-front{% endif %}"
{% if inputs.dirs.ui %}ui = "{{ inputs.dirs.ui }}"
{% endif %}{% if inputs.dirs.docs %}docs = "{{ inputs.dirs.docs }}"
{% endif %}

[systems]
default = "{{ inputs.system_name }}"

[systems.{{ inputs.system_name }}]
container = "{{ inputs.container_name }}"
default_workspace = "{{ inputs.default_workspace }}"
working_dir = "/workspace-root/{{ inputs.workspace_subdir }}"
user = "dev"
home = "/home/dev"
mounts = []

[systems.{{ inputs.system_name }}.workspaces.{{ inputs.default_workspace }}]

[containers]
default = "{{ inputs.container_name }}"

[containers.{{ inputs.container_name }}]
startup = "detached"
project_name = "{{ resolved_project_name }}"
primary_service = "{{ inputs.workspace_service_name }}"

[containers.{{ inputs.container_name }}.aliases]
psql = "postgres"

[containers.{{ inputs.container_name }}.services.{{ inputs.workspace_service_name }}]
catalog = "workspace-rust-bun"
working_subdir = "{{ inputs.workspace_subdir }}"
browser_runtime = "{{ inputs.browser_runtime }}"
# Rust toolchain for the workspace image. Must satisfy the family's MSRV
# floor (sqlx 0.9 needs 1.94, AWS SDK 1.10+ needs 1.94.1) and ideally match
# the operators' host toolchain. Bump deliberately.
rust_version = "1.96"
host_ports = [
  "{{ inputs.api_port }}:{{ inputs.api_port }}",
  "{{ inputs.admin_port }}:{{ inputs.admin_port }}",
  "{{ inputs.front_port }}:{{ inputs.front_port }}",
]
isolated_dirs = [
  "{% if inputs.dirs.api %}{{ inputs.dirs.api }}{% else %}app-api{% endif %}/target",
{% if inputs.workspace.js_root %}  # One root Bun workspace hoists dependencies to the repo root, so that is
  # the tree the container must isolate from the host.
  "node_modules",
{% else %}  "{% if inputs.dirs.client %}{{ inputs.dirs.client }}{% else %}app-client{% endif %}/node_modules",
  "{% if inputs.dirs.ui %}{{ inputs.dirs.ui }}{% else %}app-ui{% endif %}/node_modules",
  "{% if inputs.dirs.front %}{{ inputs.dirs.front }}{% else %}app-front{% endif %}/node_modules",
  "{% if inputs.dirs.admin %}{{ inputs.dirs.admin }}{% else %}app-admin{% endif %}/node_modules",
{% endif %}]

[containers.{{ inputs.container_name }}.services.postgres]
catalog = "postgres"
database = "{{ inputs.databases|first }}"
databases = [{% for database in inputs.databases %}"{{ database }}"{% if not loop.last %}, {% endif %}{% endfor %}]

[containers.{{ inputs.container_name }}.services.dbgate]
catalog = "dbgate"
database_host = "postgres"
database = "{{ inputs.databases|first }}"
connection_label = "{{ resolved_project_name }}"

[containers.{{ inputs.container_name }}.services.mailpit]
catalog = "mailpit"

# The object store is PGSTY Silo, a maintained MinIO fork; upstream MinIO
# images are no longer pullable. The service keeps the name `minio` so
# in-container endpoints (`http://minio:9000`) and the existing data volume
# carry over unchanged.
[containers.{{ inputs.container_name }}.services.minio]
catalog = "silo"

[containers.{{ inputs.container_name }}.dns]
routes = [
  { domain = "{{ route_domain(inputs.host, inputs.routes.front, '') }}", tls = true, port = {{ inputs.front_port }}, service = "{{ inputs.workspace_service_name }}" },
  { domain = "{{ route_domain(inputs.host, inputs.routes.admin, 'admin') }}", tls = true, port = {{ inputs.admin_port }}, service = "{{ inputs.workspace_service_name }}" },
  { domain = "{{ route_domain(inputs.host, inputs.routes.api, 'api') }}", tls = true, port = {{ inputs.api_port }}, service = "{{ inputs.workspace_service_name }}" },
  { domain = "{{ route_domain(inputs.host, inputs.routes.s3, 's3') }}", tls = true, port = 9000, service = "minio" },
  { domain = "dbgate.{{ inputs.host }}", tls = true, port = 3000, service = "dbgate" },
  { domain = "mailpit.{{ inputs.host }}", tls = true, port = 8025, service = "mailpit" },
  { domain = "minio.{{ inputs.host }}", tls = true, port = 9001, service = "minio" },
]

[secrets]
backend = "effigy-vault"

[secrets.vault]
path = ".effigy/secrets/local.vault"
identity = "passphrase"
unlock = "passphrase"
generate = { rhai = "{{ bundle.root }}/scripts/generate-dev-secrets.rhai", run_in = "host" }

[secrets.keys.auth_jwt_private_key]
required = false
targets = ["tasks", "containers", "rhai"]
description = "JWT signing private key for local/API runtime."

[secrets.keys.auth_jwt_public_key]
required = false
targets = ["tasks", "containers", "rhai"]
description = "JWT verification public key paired with AUTH_JWT_PRIVATE_KEY."

[secrets.keys.auth_oauth_secret_key]
required = false
targets = ["tasks", "containers", "rhai"]
description = "OAuth refresh-token encryption key."

[secrets.keys.encryption_key]
required = false
targets = ["tasks", "containers", "rhai"]
description = "Application encryption key for local/API runtime."

[secrets.keys.aws_access_key_id]
required = false
targets = ["tasks", "containers", "state", "artifacts", "rhai"]
description = "S3-compatible object-store access key id for media state/artifact workflows."

[secrets.keys.aws_secret_access_key]
required = false
targets = ["tasks", "containers", "state", "artifacts", "rhai"]
description = "S3-compatible object-store secret access key for media state/artifact workflows."

[secrets.keys.ai_router_api_key]
required = false
targets = ["tasks", "containers", "rhai"]
description = "AI router API key when the AI runtime is enabled."

[secrets.keys.smtp_password]
required = false
targets = ["tasks", "containers"]
description = "SMTP password when real email delivery is enabled."

[secrets.keys.auth_google_client_secret]
required = false
targets = ["tasks", "containers"]
description = "Google OAuth client secret when Google login is enabled."

{% if inputs.workspace.js_root %}
# One frozen root install for the whole JavaScript workspace. Consumers on the
# `apps/*` / `packages/*` contract own a single root `package.json` + `bun.lock`,
# so per-package hydration is drift.
[tasks."workspace:js:prepare"]
run = "cd {repo} && bun install --frozen-lockfile"
run_in = "host"

{% endif %}[tasks.health]
run = [
{% if inputs.dirs.docs %}  { task = "{{ sel_docs }}/health" },
{% endif %}  { task = "{{ sel_api }}/health" },
  { task = "{{ sel_client }}/health" },
{% if inputs.dirs.ui %}  { task = "{{ sel_ui }}/health" },
{% endif %}  { task = "{{ sel_admin }}/health" },
  { task = "{{ sel_front }}/health" },
]

# Re-run the bucket and CORS bootstrap against a running stack. Shares the
# bootstrap script so both paths name the same bucket.
[tasks."minio:reconcile"]
run = [{ rhai = "{{ bundle.root }}/scripts/bootstrap-minio.rhai" }]
run_in = "host"

[tasks.validate]
run = [
{% if inputs.sources.siblings %}  { task = "underlay/validate" },
{% endif %}{% if inputs.dirs.docs %}  { task = "{{ sel_docs }}/validate" },
{% endif %}  { task = "{{ sel_api }}/validate" },
  { task = "{{ sel_client }}/validate" },
{% if inputs.dirs.ui %}  { task = "{{ sel_ui }}/validate" },
{% endif %}  { task = "{{ sel_admin }}/validate" },
  { task = "{{ sel_front }}/validate" },
]

[tasks.qa]
run = [
  { task = "health" },
  { task = "validate" },
{% if inputs.dirs.docs %}  { task = "{{ sel_docs }}/qa:docs" },
  { task = "{{ sel_docs }}/qa:northstar" },
{% endif %}]

{% set hybrid_default = inputs.profiles.enabled and inputs.profiles.dev == "hybrid" %}
# The whole-stack container session. It is `dev` unless the consumer makes
# the hybrid profile its default, in which case it stays as `dev:container`.
{% if hybrid_default %}[tasks."dev:container"]{% else %}[tasks.dev]{% endif %}
mode = "tui"
container_lifecycle = true
secrets = "required"
gateway = true
health_wait = true
concurrent = [
  { name = "front", task = "{{ sel_front }}/dev", setup = [{ rhai = "{{ bundle.root }}/scripts/dev/ui-setup.rhai" }], start = 6, tab = 1 },
  { name = "admin", task = "{{ sel_admin }}/dev", setup = [{ rhai = "{{ bundle.root }}/scripts/dev/ui-setup.rhai" }], start = 5, tab = 2 },
  { name = "api", task = "{{ sel_api }}/api", start = 4, tab = 3 },
  { name = "jobs", task = "{{ sel_api }}/jobs", start = 3, tab = 4, start_after_ms = 1500 },
  { role = "shell", service = "{{ inputs.workspace_service_name }}", start = 2, tab = 5 },
  { role = "lifecycle", start = 1, tab = 6 },
]

{% if inputs.profiles.enabled %}
# Opt-in host profiles. Services stay in containers; the API, front and
# admin run on the host as Effigy managed listeners behind the gateway.
# Effigy scopes names, ports and aliases per checkout; profile_env.py maps
# its `container hosts` report onto the app environment. `dev:hybrid` uses
# the declared names; `dev:test` uses a `test.` prefix so both can run at once.
{% set raw_project = inputs.project_name or resolved_project_name %}
{% set media_bucket = (raw_project[:-4] if raw_project[-4:] == "-dev" else raw_project) ~ "-media" %}
{% for profile in [("hybrid", inputs.host, "hybrid"), ("test", "test." ~ inputs.host, "test")] %}
{% set container = profile[0] %}
{% set profile_host = profile[1] %}
{% set api_domain = route_domain(profile_host, inputs.routes.api, "api") %}
{% set front_domain = route_domain(profile_host, inputs.routes.front, "") %}
{% set admin_domain = route_domain(profile_host, inputs.routes.admin, "admin") %}
{% set s3_domain = route_domain(profile_host, inputs.routes.s3, "s3") %}
{% set profile_env %}EFFIGY_PROFILE_DATABASE = "{{ inputs.databases|first }}", EFFIGY_PROFILE_BUCKET = "{{ media_bucket }}", EFFIGY_PROFILE_API_DECLARED = "{{ api_domain }}", EFFIGY_PROFILE_FRONT_DECLARED = "{{ front_domain }}", EFFIGY_PROFILE_ADMIN_DECLARED = "{{ admin_domain }}", EFFIGY_PROFILE_S3_DECLARED = "{{ s3_domain }}"{% endset %}

[containers.{{ container }}]
startup = "detached"
project_name = "{{ resolved_project_name }}-{{ profile[2] }}"
primary_service = "postgres"
working_dir = "/tmp"

[containers.{{ container }}.services.postgres]
catalog = "postgres"
database = "{{ inputs.databases|first }}"
databases = [{% for database in inputs.databases %}"{{ database }}"{% if not loop.last %}, {% endif %}{% endfor %}]

[containers.{{ container }}.services.dbgate]
catalog = "dbgate"
database_host = "postgres"
database = "{{ inputs.databases|first }}"
connection_label = "{{ resolved_project_name }} {{ container }}"

[containers.{{ container }}.services.mailpit]
catalog = "mailpit"

[containers.{{ container }}.services.minio]
catalog = "silo"

[containers.{{ container }}.dns]
routes = [
  { domain = "{{ s3_domain }}", tls = true, port = 9000, service = "minio" },
  { domain = "dbgate.{{ profile_host }}", tls = true, port = 3000, service = "dbgate" },
  { domain = "mailpit.{{ profile_host }}", tls = true, port = 8025, service = "mailpit" },
  { domain = "minio.{{ profile_host }}", tls = true, port = 9001, service = "minio" },
]

[[containers.{{ container }}.host_processes]]
name = "api"
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_env.py" exec {{ container }} -- python3 "{{ bundle.root }}/scripts/dev/managed-rust-listener.py" -- effigy profile:api'
cwd = "."
restart = "on-failure"
env = { {{ profile_env }} }

[containers.{{ container }}.host_processes.listener]
bind = "127.0.0.1:0"

[containers.{{ container }}.host_processes.listener.readiness]
path = "/v1/health"
status = 200
timeout_secs = 600

[containers.{{ container }}.host_processes.listener.route]
domain = "{{ api_domain }}"
tls = true
# Background jobs: a supervised host process with no listener or route.
[[containers.{{ container }}.host_processes]]
name = "jobs"
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_env.py" exec {{ container }} -- effigy profile:jobs'
cwd = "."
restart = "on-failure"
depends_on = ["api"]
env = { {{ profile_env }} }

{% for app in [("front", inputs.dirs.front or "app-front", front_domain), ("admin", inputs.dirs.admin or "app-admin", admin_domain)] %}

[[containers.{{ container }}.host_processes]]
name = "{{ app[0] }}"
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_env.py" exec --self {{ app[0] }} {{ container }} -- bun "{{ bundle.root }}/scripts/dev/managed-vite-listener.mjs"'
cwd = "{{ app[1] }}"
restart = "on-failure"
depends_on = ["api"]
env = { {{ profile_env }} }

[containers.{{ container }}.host_processes.listener]
bind = "127.0.0.1:0"

[containers.{{ container }}.host_processes.listener.readiness]
path = "/"
status = 200
timeout_secs = 300

[containers.{{ container }}.host_processes.listener.route]
domain = "{{ app[2] }}"
tls = true
{% endfor %}
{% endfor %}
{% set hybrid_env %}EFFIGY_PROFILE_DATABASE = "{{ inputs.databases|first }}", EFFIGY_PROFILE_BUCKET = "{{ media_bucket }}", EFFIGY_PROFILE_API_DECLARED = "{{ route_domain(inputs.host, inputs.routes.api, 'api') }}", EFFIGY_PROFILE_FRONT_DECLARED = "{{ route_domain(inputs.host, inputs.routes.front, '') }}", EFFIGY_PROFILE_ADMIN_DECLARED = "{{ route_domain(inputs.host, inputs.routes.admin, 'admin') }}", EFFIGY_PROFILE_S3_DECLARED = "{{ route_domain(inputs.host, inputs.routes.s3, 's3') }}"{% endset %}
{% set test_host = "test." ~ inputs.host %}
{% set test_env %}EFFIGY_PROFILE_DATABASE = "{{ inputs.databases|first }}", EFFIGY_PROFILE_BUCKET = "{{ media_bucket }}", EFFIGY_PROFILE_API_DECLARED = "{{ route_domain(test_host, inputs.routes.api, 'api') }}", EFFIGY_PROFILE_FRONT_DECLARED = "{{ route_domain(test_host, inputs.routes.front, '') }}", EFFIGY_PROFILE_ADMIN_DECLARED = "{{ route_domain(test_host, inputs.routes.admin, 'admin') }}", EFFIGY_PROFILE_S3_DECLARED = "{{ route_domain(test_host, inputs.routes.s3, 's3') }}"{% endset %}

# Host processes carry no vault secrets of their own, and task secrets do
# not reach composed child tasks; run the API as a nested command instead.
[tasks."profile:api"]
run = "effigy {{ sel_api }}/api"
run_in = "host"
secrets = "required"

[tasks."profile:jobs"]
run = "effigy {{ sel_api }}/jobs"
run_in = "host"
secrets = "required"

[tasks."dev:hybrid"]
run = [
  { task = "container hybrid up --detach" },
  "python3 \"{{ bundle.root }}/scripts/dev/profile_env.py\" bootstrap hybrid",
]
run_in = "host"
secrets = "required"
env = { {{ hybrid_env }} }

[tasks."dev:hybrid:status"]
run = [{ task = "container hybrid status" }]
run_in = "host"

[tasks."dev:hybrid:logs"]
run = [{ task = "container hybrid logs --follow" }]
run_in = "host"

[tasks."dev:hybrid:down"]
run = [{ task = "container hybrid down" }]
run_in = "host"

# Run a host command against the running hybrid profile's services, e.g.
# `effigy hybrid:exec -- cargo run --bin migrate`.
[tasks."hybrid:exec"]
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_env.py" exec hybrid -- {args}'
run_in = "host"
secrets = "required"
env = { {{ hybrid_env }} }

{% if hybrid_default %}
[tasks.dev]
run = [{ task = "dev:hybrid" }]
run_in = "host"

[tasks."dev:down"]
run = [{ task = "dev:hybrid:down" }]
run_in = "host"
{% endif %}

# Fresh data, one configured selector, then teardown. Never implies qa.
[tasks."dev:test"]
run = 'python3 "{{ bundle.root }}/scripts/dev/profile_env.py" test test --task "{{ inputs.profiles.test_task }}" --timeout {{ inputs.profiles.test_timeout_secs }}'
run_in = "host"
secrets = "required"
env = { {{ test_env }} }
{% endif %}

[bootstrap]
run = [
  { task = "secrets init" },
  { task = "container up --detach" },
  { rhai = "{{ bundle.root }}/scripts/bootstrap-minio.rhai" },
{% if inputs.workspace.js_root %}  { task = "workspace:js:prepare" },
{% elif inputs.sources.siblings %}  { task = "bootstrap deps sync {% if inputs.sources.underlay %}{{ inputs.sources.underlay }}{% else %}../underlay{% endif %}{% if inputs.dirs.api %} {{ inputs.dirs.api }}{% else %} app-api{% endif %}{% if inputs.dirs.client %} {{ inputs.dirs.client }}{% else %} app-client{% endif %}{% if inputs.dirs.ui %} {{ inputs.dirs.ui }}{% else %} app-ui{% endif %}{% if inputs.dirs.front %} {{ inputs.dirs.front }}{% else %} app-front{% endif %}{% if inputs.dirs.admin %} {{ inputs.dirs.admin }}{% else %} app-admin{% endif %}" },
{% endif %}
]
start = "dev"

{% if inputs.sources.siblings %}[[bootstrap.children]]
path = "{% if inputs.sources.underlay %}{{ inputs.sources.underlay }}{% else %}../underlay{% endif %}"
repo = "git@github.com:inflatable-cookie/underlay.git"
branch = "main"

[[bootstrap.children]]
path = "{% if inputs.sources.poodle %}{{ inputs.sources.poodle }}{% else %}../poodle{% endif %}"
repo = "git@github.com:inflatable-cookie/poodle.git"
branch = "main"
{% endif %}

[deploy.model.app]
bundle = "{{ bundle.name }}"
project_name = "{{ resolved_project_name }}"
source_root = "."

[[deploy.model.services]]
name = "front"
role = "static"
runtime = "node"
source_root = "{% if inputs.dirs.front %}{{ inputs.dirs.front }}{% else %}app-front{% endif %}"
domains = ["{{ route_domain(inputs.host, inputs.routes.front, '') }}"]

[deploy.model.services.build]
task = "build"

[deploy.model.services.output]
kind = "directory"
path = "build"
detect_static_fallback = true

[[deploy.model.services]]
name = "admin"
role = "static"
runtime = "node"
source_root = "{% if inputs.dirs.admin %}{{ inputs.dirs.admin }}{% else %}app-admin{% endif %}"
domains = ["{{ route_domain(inputs.host, inputs.routes.admin, 'admin') }}"]

[deploy.model.services.build]
task = "build"

[deploy.model.services.output]
kind = "directory"
path = "build"
detect_static_fallback = true

[[deploy.model.services]]
name = "api"
role = "web"
runtime = "rust"
source_root = "{% if inputs.dirs.api %}{{ inputs.dirs.api }}{% else %}app-api{% endif %}"
port = {{ inputs.api_port }}
domains = ["{{ route_domain(inputs.host, inputs.routes.api, 'api') }}"]
secret_refs = ["DATABASE_URL"]

[deploy.model.services.build]
task = "build"

[deploy.model.services.start]
task = "api"

[deploy.model.services.release]
task = "db:migrate"
optional = true
warn_if_missing = true
warning_code = "missing-release-hook"
warning_target = "api"
warning_message = "No explicit `db:migrate` release or migration command is promoted into the deployment model yet"
warning_severity = "warn"

[deploy.model.services.health]
kind = "http"
path = "/v1/health"

[[deploy.model.services]]
name = "jobs"
role = "worker"
runtime = "rust"
source_root = "{% if inputs.dirs.api %}{{ inputs.dirs.api }}{% else %}app-api{% endif %}"
secret_refs = ["DATABASE_URL"]

[deploy.model.services.build]
task = "build"

[deploy.model.services.start]
task = "jobs"
omit_service_if_missing = true

[[deploy.model.backing_services]]
name = "postgres"
kind = "postgres"
mode = "managed"
required = true
consumers = ["api", "jobs"]

[[deploy.model.domains]]
host = "{{ route_domain(inputs.host, inputs.routes.front, '') }}"
service = "front"
tls = "provider_managed"

[[deploy.model.domains]]
host = "{{ route_domain(inputs.host, inputs.routes.admin, 'admin') }}"
service = "admin"
tls = "provider_managed"

[[deploy.model.domains]]
host = "{{ route_domain(inputs.host, inputs.routes.api, 'api') }}"
service = "api"
tls = "provider_managed"

[[deploy.model.secrets]]
name = "DATABASE_URL"
services = ["api", "jobs"]
required = true
source = "operator"
notes = "Managed Postgres connection string for primary database `{% if inputs.databases %}{{ inputs.databases|first }}{% else %}app{% endif %}`"

[tasks."smoke:error-logging"]
run = [{ rhai = "{{ bundle.root }}/scripts/error-reporting.rhai" }]
run_in = "host"

[tasks."metrics:error-log"]
run = [{ rhai = "{{ bundle.root }}/scripts/error-reporting.rhai" }]
run_in = "host"

[tasks."validate:error-reporting"]
run = [{ rhai = "{{ bundle.root }}/scripts/error-reporting.rhai" }]
run_in = "host"

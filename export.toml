database_host = "postgres"
database = "{{ inputs.databases|first }}"
database_user = "postgres"
database_password = "secret"
connection_label = "{{ resolved_project_name }} disposable test"

[containers.disposable_test.services.mailpit]
catalog = "mailpit"

[containers.disposable_test.services.silo]
catalog = "silo"

[containers.disposable_test.services.silo_client]

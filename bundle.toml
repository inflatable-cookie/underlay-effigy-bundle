[bundle]
name = "underlay"
description = "Underlay-style Rust + Bun workspace stack with one long-running workspace container, bundled postgres/dbgate/mailpit/minio services, gateway-published HTTPS app/S3/helper routes, and loopback alias discovery for db/smtp/s3."
defaults = "export.toml"

[[inputs]]
name = "host"
type = "string"
required = true
description = "Primary local hostname for the front-end route; bundle defaults also publish `admin.<host>`, `api.<host>`, `s3.<host>`, `dbgate.<host>`, `mailpit.<host>`, and `minio.<host>`."
example = "acme.test"

[[inputs]]
name = "project_name"
type = "string"
description = "Compose project name used for the generated dev stack. Defaults to `<workspace_subdir>-underlay`."
example = "acme-underlay"

[[inputs]]
name = "workspace_subdir"
type = "string"
required = true
description = "Repo path under `/workspace-root` for the workspace container's working directory."
example = "underlay-reference"

[[inputs]]
name = "databases"
type = "list"
required = true
description = "Postgres databases to create for the stack. The first entry becomes the primary app database."
example = ["acme", "acme_test"]

[[inputs]]
name = "api_port"
type = "integer"
description = "Host and workspace port for the API dev server."
default = 41001

[[inputs]]
name = "admin_port"
type = "integer"
description = "Host and workspace port for the admin dev server."
default = 41002

[[inputs]]
name = "front_port"
type = "integer"
description = "Host and workspace port for the public front-end dev server."
default = 41003

[[inputs]]
name = "dirs.api"
type = "string"
description = "API package directory for bootstrap env generation and dependency sync. When omitted, the bundle falls back to the shipped Underlay guesses."
example = "farmyard"

[[inputs]]
name = "dirs.front"
type = "string"
description = "Front-end package directory for the bundled UI setup helper. When omitted, the helper falls back to the shipped Underlay guesses."
example = "cream"

[[inputs]]
name = "dirs.admin"
type = "string"
description = "Admin package directory for the bundled UI setup helper. When omitted, the helper falls back to the shipped Underlay guesses."
example = "dairy"

[[inputs]]
name = "sources.underlay"
type = "string"
description = "Relative path from the consumer repo to the sibling underlay checkout used by bootstrap sync, bootstrap children, and the bundled UI setup helper."
default = "../underlay"
example = "../../underlay"

[[inputs]]
name = "sources.poodle"
type = "string"
description = "Relative path from the consumer repo to the sibling poodle checkout used by bootstrap children and the bundled UI setup helper."
default = "../poodle"
example = "../../poodle"

[[inputs]]
name = "dirs.client"
type = "string"
description = "Shared client package directory the bundled UI setup helper should hydrate before front/admin startup. When omitted, the helper falls back to the shipped Underlay guesses."
example = "froyo"

[[inputs]]
name = "dirs.ui"
type = "string"
description = "Optional UI package directory to include in bootstrap dependency sync and UI hydration. When omitted, the helper falls back to the shipped Underlay guesses."
example = "app-ui"

[[inputs]]
name = "dirs.docs"
type = "string"
description = "Optional docs package directory. When set, the bundle wires docs health, validate, qa:docs, and qa:northstar into the root task defaults."
example = "acme-docs"

[[inputs]]
name = "catalogs.api"
type = "string"
default = ""
description = "Effigy catalog alias for the api package, used in generated task selectors. Defaults to `dirs.api` when empty. Set this when the physical directory is no longer the catalog alias, e.g. `dirs.api = \"apps/farmyard-api\"` with `catalogs.api = \"farmyard-api\"`."
example = "farmyard-api"

[[inputs]]
name = "catalogs.admin"
type = "string"
default = ""
description = "Effigy catalog alias for the admin package, used in generated task selectors. Defaults to `dirs.admin` when empty. Set this when the physical directory is no longer the catalog alias, e.g. `dirs.admin = \"apps/dairy-admin\"` with `catalogs.admin = \"dairy-admin\"`."
example = "dairy-admin"

[[inputs]]
name = "catalogs.front"
type = "string"
default = ""
description = "Effigy catalog alias for the front package, used in generated task selectors. Defaults to `dirs.front` when empty. Set this when the physical directory is no longer the catalog alias, e.g. `dirs.front = \"apps/cream-front\"` with `catalogs.front = \"cream-front\"`."
example = "cream-front"

[[inputs]]
name = "catalogs.client"
type = "string"
default = ""
description = "Effigy catalog alias for the client package, used in generated task selectors. Defaults to `dirs.client` when empty. Set this when the physical directory is no longer the catalog alias, e.g. `dirs.client = \"apps/froyo-client\"` with `catalogs.client = \"froyo-client\"`."
example = "froyo-client"

[[inputs]]
name = "catalogs.ui"
type = "string"
default = ""
description = "Effigy catalog alias for the ui package, used in generated task selectors. Defaults to `dirs.ui` when empty. Set this when the physical directory is no longer the catalog alias, e.g. `dirs.ui = \"apps/froyo-ui\"` with `catalogs.ui = \"froyo-ui\"`."
example = "froyo-ui"

[[inputs]]
name = "catalogs.docs"
type = "string"
default = ""
description = "Effigy catalog alias for the docs package, used in generated task selectors. Defaults to `dirs.docs` when empty. Set this when the physical directory is no longer the catalog alias, e.g. `dirs.docs = \"apps/acme-docs\"` with `catalogs.docs = \"acme-docs\"`."
example = "acme-docs"

[[inputs]]
name = "workspace.js_root"
type = "bool"
default = false
description = "Set true when the repo declares one root Bun workspace with a single root `bun.lock`. Bootstrap and the dev UI setup helper then run exactly one `bun install --frozen-lockfile` at the repo root instead of hydrating each package directory."

[[inputs]]
name = "routes.front"
type = "string"
description = "Gateway subdomain label for the front-end route. Empty keeps the bare host."
default = ""
example = "cream"

[[inputs]]
name = "routes.admin"
type = "string"
description = "Gateway subdomain label for the admin route."
default = "admin"
example = "dairy"

[[inputs]]
name = "routes.api"
type = "string"
description = "Gateway subdomain label for the API route."
default = "api"
example = "farmyard"

[[inputs]]
name = "routes.s3"
type = "string"
description = "Gateway subdomain label for the S3 API route."
default = "s3"
example = "blob"

[[inputs]]
name = "system_name"
type = "string"
description = "Name of the `[systems.<name>]` block rendered by the bundle."
default = "dev"

[[inputs]]
name = "container_name"
type = "string"
description = "Name of the `[containers.<name>]` block that hosts the stack (also used as the default container)."
default = "stack"

[[inputs]]
name = "workspace_service_name"
type = "string"
description = "Name of the long-running workspace service inside the container (referenced by `primary_service` and by the published HTTP routes)."
default = "workspace"

[[inputs]]
name = "default_workspace"
type = "string"
description = "Name of the `[systems.<system>.workspaces.<name>]` workspace treated as the system default."
default = "app"
